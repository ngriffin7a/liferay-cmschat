# SPDX-License-Identifier: LGPL-2.1-or-later

liferay.oauth.application.external.reference.codes=\
    liferay-cmschatmicroservice-oauth-application-user-agent

liferay.oauth.urls.excludes=/ready

#
# Spring Boot
#

server.port=58081

#
# CORS
#
# Comma-separated list of allowed origin patterns for fragment cross-origin
# requests. Defaults to "*" for local dev; scope to e.g. https://*.lfr.cloud
# for PaaS deployments.
#

cors.allowed.origin.patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}

#
# CMS Chat
#
liferay.admin.email=${LIFERAY_ADMIN_EMAIL:test@liferay.com}
liferay.admin.password=${LIFERAY_ADMIN_PASSWORD:test}
liferay.base.url=${LIFERAY_BASE_URL:http://localhost:8080}
liferay.headless.api.base.url=${liferay.base.url}/o

security.oauth2.resourceserver.jwk.jwk-set-uri=${liferay.base.url}/o/oauth2/jwks

cmschat.openai.model=gpt-4o
cmschat.openai.system-prompt=You are an assistant that incorporates the title, description, and text content provided within user messages into responses. The responses should also contain hyperlinked titles using download URLs provided within user messages. If a URL is not provided for a specific item, do not hyperlink its title and do not invent or hallucinate a URL.
cmschat.instruction.keyword-highlight=INSTRUCTION; exclusive keywords to highlight as bold+italic:
cmschat.instruction.title=INSTRUCTION; %s title for inclusion in a reference:
cmschat.instruction.url=INSTRUCTION; %s URL for inclusion in a reference:
cmschat.instruction.focus=INSTRUCTION; The main focus of the response should center around these keywords:
cmschat.instruction.content=INSTRUCTION; Use the following %s text as a basis for responding to the keywords:


logging.level.root=INFO
logging.level.com.liferay.demo.cmschat=DEBUG
#logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.web.filter.CorsFilter=TRACE
#logging.level.org.springframework.security=DEBUG

openai.key=${OPENAI_API_KEY:sk-PLACEHOLDER}

#
# Search Type Mappings
#
cmschat.search.mappings[0].type=BLOG
cmschat.search.mappings[0].title=Blog
cmschat.search.mappings[0].match-field=subtitle
cmschat.search.mappings[0].match-field-disambiguation-order=2
cmschat.search.mappings[0].strategy=HTML
cmschat.search.mappings[0].text-field=contentRawText

cmschat.search.mappings[1].type=DOCUMENT
cmschat.search.mappings[1].title=Document
cmschat.search.mappings[1].match-field=file
cmschat.search.mappings[1].strategy=CMS2_DOCUMENT

cmschat.search.mappings[2].type=FOLDER
cmschat.search.mappings[2].title=Folder
cmschat.search.mappings[2].match-field=numberOfDocuments

cmschat.search.mappings[3].type=PAGE
cmschat.search.mappings[3].title=Page
cmschat.search.mappings[3].match-field=pageType

cmschat.search.mappings[4].type=USER
cmschat.search.mappings[4].title=User
cmschat.search.mappings[4].match-field=jobTitle

cmschat.search.mappings[5].type=LEGACY_ARTICLE
cmschat.search.mappings[5].title=Article
cmschat.search.mappings[5].match-field=contentStructureId
cmschat.search.mappings[5].strategy=CONTENT_FIELDS

cmschat.search.mappings[6].type=LEGACY_BLOG
cmschat.search.mappings[6].title=Blog
cmschat.search.mappings[6].match-field=headline
cmschat.search.mappings[6].strategy=HTML
cmschat.search.mappings[6].text-field=articleBody

cmschat.search.mappings[7].type=LEGACY_DOCUMENT
cmschat.search.mappings[7].title=Document
cmschat.search.mappings[7].match-field=documentType
cmschat.search.mappings[7].strategy=DOCUMENT

cmschat.search.mappings[8].type=LEGACY_DOCUMENT
cmschat.search.mappings[8].title=Document
cmschat.search.mappings[8].match-entry-class-name=com.liferay.document.library.kernel.model.DLFileEntry
cmschat.search.mappings[8].strategy=DOCUMENT

cmschat.search.mappings[9].type=FORUM_MESSAGE
cmschat.search.mappings[9].title=Forum Discussion
cmschat.search.mappings[9].match-field=messageTitle
cmschat.search.mappings[9].match-action-href-contains=/forummessages/

cmschat.search.mappings[10].type=FORUM_REPLY
cmschat.search.mappings[10].title=Forum Reply
cmschat.search.mappings[10].match-field=subject
cmschat.search.mappings[10].match-action-href-contains=/forumreplies/
cmschat.search.mappings[10].strategy=HTML
cmschat.search.mappings[10].text-field=body