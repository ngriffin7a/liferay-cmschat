assemble:
    - from: site-initializer
      into: site-initializer

cmschat-global-site-initializer:
    description: Liferay CMS Chat — Site Initializer for fragments in global scope.
    name: Liferay CMS Chat
    oAuthApplicationHeadlessServer: cmschat-global-site-initializer-oauth-application-headless-server
    siteExternalReferenceCode: L_GLOBAL
    siteName: Global
    type: siteInitializer

cmschat-global-site-initializer-oauth-application-headless-server:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Liferay CMS Chat Global Site Initializer OAuth Application Headless Server
    scopes:
        - Liferay.Headless.Site.everything
    type: oAuthApplicationHeadlessServer
